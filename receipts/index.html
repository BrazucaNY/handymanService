<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Receipt Manager | Here Handyman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #071828;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }
    .logo {
      text-align: center;
      margin-bottom: 8px;
      font-size: 22px;
      font-weight: 700;
    }
    .logo .here { color: #071828; }
    .logo .handyman { color: #eab308; }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 38px;
      color: #071828;
      text-align: center;
      letter-spacing: 1px;
      margin-bottom: 28px;
    }
    .field { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 6px;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #eab308; }
    .btn {
      width: 100%;
      background: #eab308;
      color: #071828;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn:hover { background: #facc15; }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .debug {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #86efac;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      margin-top: 16px;
      display: none;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><span class="here">Here</span><span class="handyman">Handyman</span></div>
    <h1>Receipt Manager</h1>

    <div id="error-msg" class="error"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button type="submit" id="btn" class="btn">Sign In</button>
    </form>

    <div id="debug-msg" class="debug"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://fclcikyctulmirjbksld.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7oF3akslbBEFyuR0zfLcEw_h09E117h';

    const errorDiv = document.getElementById('error-msg');
    const debugDiv = document.getElementById('debug-msg');
    const btn = document.getElementById('btn');

    function showError(msg) {
      errorDiv.textContent = msg;
      errorDiv.style.display = 'block';
    }

    function showDebug(msg) {
      debugDiv.textContent = msg;
      debugDiv.style.display = 'block';
    }

    // Initialize Supabase client safely
    let supabase;
    try {
      if (!window.supabase) throw new Error('Supabase SDK not loaded from CDN');
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      showDebug('Supabase initialized OK. Ready to sign in.');
    } catch (e) {
      showError('System error: ' + e.message + '. Please reload the page.');
    }

    // Set up form handler FIRST (before any async work)
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!supabase) { showError('Not initialized — please reload.'); return; }

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      errorDiv.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        showDebug('Attempting login for: ' + email);
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          showDebug('Supabase error: ' + JSON.stringify(error));
          throw error;
        }

        showDebug('Login success! Session: ' + (data.session ? 'YES' : 'NO') + '. Redirecting...');
        window.location.href = '/receipts/dashboard';

      } catch (err) {
        showError(err.message || 'Login failed. Check your email and password.');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    // Check if already logged in (non-blocking — after form is set up)
    if (supabase) {
      supabase.auth.getSession().then(({ data: { session } }) => {
        if (session) {
          showDebug('Already logged in — redirecting to dashboard...');
          window.location.href = '/receipts/dashboard';
        }
      }).catch(e => {
        showDebug('getSession error: ' + e.message);
      });
    }
  </script>
</body>
</html>
