<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Receipt Manager | Here Handyman</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  
  <!-- Tailwind via CDN for quick styling matching the design system -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#071828',
            orange: '#eab308',
            orange2: '#facc15',
            cream: '#f9f5ef'
          },
          fontFamily: {
            bebas: ['"Bebas Neue"', 'sans-serif'],
            sans: ['"DM Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-navy min-h-screen flex items-center justify-center font-sans p-4">

  <div class="bg-white rounded-[14px] shadow-2xl p-8 w-full max-w-md">
    <div class="text-center mb-8">
      <div class="text-2xl font-bold mb-2">
        <span class="text-navy">Here</span><span class="text-orange">Handyman</span>
      </div>
      <h1 class="text-4xl font-bebas text-navy tracking-wide">Receipt Manager</h1>
    </div>

    <div id="error-message" class="hidden bg-red-100 text-red-700 p-3 rounded-lg mb-6 text-sm"></div>

    <form id="login-form" class="space-y-6">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange focus:border-orange outline-none transition-colors">
      </div>
      
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange focus:border-orange outline-none transition-colors">
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-orange hover:bg-orange2 text-navy font-bold py-3 px-4 rounded-lg transition-colors flex justify-center items-center">
        <span id="btn-text">Sign In</span>
        <svg id="btn-loader" class="hidden animate-spin ml-2 h-5 w-5 text-navy" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://fclcikyctulmirjbksld.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7oF3akslbBEFyuR0zfLcEw_h09E117h';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener('DOMContentLoaded', async () => {
      // Check auth
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        window.location.href = '/receipts/dashboard';
      }

      const form = document.getElementById('login-form');
      const errorDiv = document.getElementById('error-message');
      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const btnLoader = document.getElementById('btn-loader');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // Reset state
        errorDiv.classList.add('hidden');
        submitBtn.disabled = true;
        btnText.textContent = 'Signing in...';
        btnLoader.classList.remove('hidden');

        try {
          const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;
          
          window.location.href = '/receipts/dashboard';
        } catch (error) {
          errorDiv.textContent = error.message;
          errorDiv.classList.remove('hidden');
          // Shake animation
          errorDiv.animate([
            { transform: 'translateX(0)' },
            { transform: 'translateX(-5px)' },
            { transform: 'translateX(5px)' },
            { transform: 'translateX(-5px)' },
            { transform: 'translateX(5px)' },
            { transform: 'translateX(0)' }
          ], { duration: 400, iterations: 1 });
        } finally {
          submitBtn.disabled = false;
          btnText.textContent = 'Sign In';
          btnLoader.classList.add('hidden');
        }
      });
    });
  </script>
</body>
</html>
