<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Receipt | Receipt Manager | Here Handyman</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#071828',
            orange: '#eab308',
            orange2: '#facc15',
            cream: '#f9f5ef'
          },
          fontFamily: {
            bebas: ['"Bebas Neue"', 'sans-serif'],
            sans: ['"DM Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-cream min-h-screen font-sans text-gray-800 pb-12">

  <nav class="bg-navy text-white p-4 sticky top-0 z-10 shadow-md">
    <div class="max-w-3xl mx-auto flex items-center">
      <a href="/receipts/dashboard" class="flex items-center text-gray-300 hover:text-white mr-4">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      </a>
      <div class="text-xl font-bebas tracking-wide">Edit Receipt</div>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto p-4 md:p-6 mt-4">
    
    <!-- Loading skeleton -->
    <div id="loading-state" class="animate-pulse space-y-6">
      <div class="h-64 bg-gray-200 rounded-[14px]"></div>
      <div class="h-96 bg-gray-200 rounded-[14px]"></div>
    </div>

    <!-- Edit Content (hidden until loaded) -->
    <div id="content-area" class="hidden space-y-6">
      
      <!-- Image Display -->
      <div id="image-container" class="hidden bg-white p-4 rounded-[14px] shadow-sm border border-gray-100 flex justify-center">
        <a id="image-link" href="#" target="_blank" class="block max-h-[400px] w-full flex justify-center">
          <img id="receipt-image" class="max-h-[400px] object-contain rounded-lg shadow-sm" src="" alt="Receipt Image">
        </a>
      </div>

      <!-- Form -->
      <form id="edit-form" class="bg-white p-4 md:p-6 rounded-[14px] shadow-sm border border-gray-100 space-y-4">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Vendor *</label>
            <input type="text" id="f-vendor" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
            <input type="date" id="f-date" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Total Amount ($) *</label>
            <input type="number" id="f-total" step="0.01" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange outline-none text-lg font-bold text-navy">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tax ($)</label>
            <input type="number" id="f-tax" step="0.01" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
            <select id="f-category" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange outline-none">
              <option value="Other">Other</option>
              <option value="Materials">Materials</option>
              <option value="Tools">Tools</option>
              <option value="Plumbing">Plumbing</option>
              <option value="Electrical">Electrical</option>
              <option value="Painting">Painting</option>
              <option value="Hardware">Hardware</option>
              <option value="Lumber">Lumber</option>
              <option value="Vehicle">Vehicle</option>
              <option value="Office">Office</option>
              <option value="Advertising">Advertising</option>
              <option value="Equipment">Equipment</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Payment Method</label>
            <input type="text" id="f-payment" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange outline-none">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
          <textarea id="f-notes" rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange outline-none"></textarea>
        </div>

        <div class="pt-6 flex flex-col md:flex-row gap-4 justify-between items-center border-t border-gray-100">
          <button type="button" id="delete-btn" class="w-full md:w-auto px-6 py-3 border border-red-200 text-red-600 hover:bg-red-50 font-medium rounded-lg transition-colors order-2 md:order-1">
            Delete Receipt
          </button>
          
          <div class="flex gap-4 w-full md:w-auto order-1 md:order-2">
            <a href="/receipts/dashboard" class="flex-1 md:flex-none px-6 py-3 border border-gray-300 text-center rounded-lg font-medium text-gray-700 hover:bg-gray-50">Cancel</a>
            <button type="submit" id="save-btn" class="flex-1 md:flex-none px-6 py-3 bg-orange hover:bg-orange2 text-navy font-bold rounded-lg flex justify-center items-center">
              <span id="save-text">Save Changes</span>
              <svg id="save-loader" class="hidden animate-spin ml-2 h-5 w-5 text-navy" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- Error State -->
    <div id="error-message" class="hidden mt-4 bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded shadow-sm"></div>

  </main>

  <!-- Delete Modal -->
  <div id="delete-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-[14px] p-6 max-w-sm w-full">
      <h3 class="text-xl font-bold mb-2">Delete Receipt?</h3>
      <p class="text-gray-600 mb-6">This action cannot be undone.</p>
      <div class="flex gap-4">
        <button id="cancel-delete" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-gray-700 font-medium">Cancel</button>
        <button id="confirm-delete" class="flex-1 px-4 py-2 bg-red-600 text-white rounded-lg font-medium hover:bg-red-700">Delete</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://fclcikyctulmirjbksld.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7oF3akslbBEFyuR0zfLcEw_h09E117h';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let receiptId = null;
    let currentReceipt = null;

    document.addEventListener('DOMContentLoaded', async () => {
      // Auth check
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = '/receipts/';
        return;
      }

      const params = new URLSearchParams(window.location.search);
      receiptId = params.get('id');

      if (!receiptId) {
        window.location.href = '/receipts/dashboard';
        return;
      }

      await loadReceipt();
      setupEventListeners();
    });

    async function loadReceipt() {
      try {
        const { data, error } = await supabase
          .from('receipts')
          .select('*')
          .eq('id', receiptId)
          .single();

        if (error) throw error;
        currentReceipt = data;

        populateForm(data);

        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('content-area').classList.remove('hidden');

      } catch (err) {
        document.getElementById('loading-state').classList.add('hidden');
        showError('Error loading receipt. It may have been deleted.');
      }
    }

    function populateForm(data) {
      if (data.image_url) {
        document.getElementById('image-container').classList.remove('hidden');
        document.getElementById('receipt-image').src = data.image_url;
        document.getElementById('image-link').href = data.image_url;
      }

      document.getElementById('f-vendor').value = data.vendor || '';
      document.getElementById('f-date').value = data.receipt_date || '';
      document.getElementById('f-total').value = data.total || '';
      document.getElementById('f-tax').value = data.tax || '';
      document.getElementById('f-category').value = data.category || 'Other';
      document.getElementById('f-payment').value = data.payment_method || '';
      document.getElementById('f-notes').value = data.notes || '';
    }

    function setupEventListeners() {
      document.getElementById('edit-form').addEventListener('submit', handleSave);
      
      // Delete flow
      document.getElementById('delete-btn').addEventListener('click', () => {
        document.getElementById('delete-modal').classList.remove('hidden');
      });
      
      document.getElementById('cancel-delete').addEventListener('click', () => {
        document.getElementById('delete-modal').classList.add('hidden');
      });
      
      document.getElementById('confirm-delete').addEventListener('click', handleDelete);
    }

    async function handleSave(e) {
      e.preventDefault();
      
      const btn = document.getElementById('save-btn');
      const text = document.getElementById('save-text');
      const loader = document.getElementById('save-loader');
      const errorDiv = document.getElementById('error-message');

      btn.disabled = true;
      text.textContent = 'Saving...';
      loader.classList.remove('hidden');
      errorDiv.classList.add('hidden');

      try {
        const updates = {
          vendor: document.getElementById('f-vendor').value,
          receipt_date: document.getElementById('f-date').value || null,
          total: parseFloat(document.getElementById('f-total').value) || 0,
          tax: parseFloat(document.getElementById('f-tax').value) || null,
          category: document.getElementById('f-category').value,
          payment_method: document.getElementById('f-payment').value,
          notes: document.getElementById('f-notes').value,
        };

        const { error } = await supabase
          .from('receipts')
          .update(updates)
          .eq('id', receiptId);

        if (error) throw error;

        // Briefly show success state then redirect
        text.textContent = 'Saved!';
        btn.classList.replace('bg-orange', 'bg-green-500');
        btn.classList.replace('text-navy', 'text-white');
        loader.classList.add('hidden');
        
        setTimeout(() => {
          window.location.href = '/receipts/dashboard';
        }, 1000);

      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        text.textContent = 'Save Changes';
        loader.classList.add('hidden');
      }
    }

    async function handleDelete() {
      const btn = document.getElementById('confirm-delete');
      btn.disabled = true;
      btn.textContent = 'Deleting...';

      try {
        if (currentReceipt && currentReceipt.image_path) {
          await supabase.storage.from('receipts').remove([currentReceipt.image_path]);
        }

        const { error } = await supabase
          .from('receipts')
          .delete()
          .eq('id', receiptId);

        if (error) throw error;
        
        window.location.href = '/receipts/dashboard';
      } catch (err) {
        showError('Failed to delete: ' + err.message);
        document.getElementById('delete-modal').classList.add('hidden');
        btn.disabled = false;
        btn.textContent = 'Delete';
      }
    }

    function showError(msg) {
      const errorDiv = document.getElementById('error-message');
      errorDiv.textContent = msg;
      errorDiv.classList.remove('hidden');
      window.scrollTo(0, 0);
    }

  </script>
</body>
</html>
