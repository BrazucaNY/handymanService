[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Remove the [context.production.environment] section completely
# Environment variables should be set in Netlify's UI

# /gallery page
[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 200

