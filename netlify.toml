# Security headers for dashboard
[[headers]]
  for = "/dashboard*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Security-Policy = "default-src 'self' https://vvwnmiffuaxiazlskeya.supabase.co https://*.supabase.co https://www.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://vvwnmiffuaxiazlskeya.supabase.co https://*.supabase.co wss://*.supabase.co;"
    Expires = "0"
    Pragma = "no-cache"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow"

