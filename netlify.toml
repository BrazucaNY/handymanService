[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "16"

# Remove the [context.production.environment] section completely
# Environment variables should be set in Netlify's UI

# Block access to sensitive files
[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/admin/firebase-config.js"
  to = "/404.html"
  status = 404

# Clean URL redirects — city landing pages (no .html in URL)
[[redirects]]
  from = "/white-plains-handyman"
  to = "/white-plains-handyman.html"
  status = 200

[[redirects]]
  from = "/scarsdale-handyman"
  to = "/scarsdale-handyman.html"
  status = 200

[[redirects]]
